name: Windows native editor
on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/windows-native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/windows-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install native editor dependencies only
        run: python -m pip install -r native/requirements.txt
      - name: Prepare pinned model assets
        run: python native/prepare_resources.py
      - name: Test native source without BSB or MPI
        run: python native/test_desktop.py
      - name: Build native executable
        run: python native/build_windows.py
      - name: Test frozen executable and exports
        run: python native/test_desktop.py --exe native/dist/CerebellumDesigner/CerebellumDesigner.exe
      - name: Package verified executable
        run: python native/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: CerebellumDesigner-Windows-x64
          path: |
            native/dist/CerebellumDesigner_Windows_x64.zip
            native/dist/SHA256SUMS.txt
            native/dist/validation_windows.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-build-diagnostics
          path: |
            native/test-output/**/last-error.txt
            native/test-output/**/desktop.log
            native/build/**/warn-*.txt
          if-no-files-found: ignore
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CerebellumDesigner-Windows-x64
          path: release
      - name: Publish tested native Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="native-v0.0.1-20261124"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; preserving published files. Artifacts are retained in this run."
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "Cerebellum Designer — Windows native 0.0.1" --notes-file native/release_notes.md
          fi
